name: Run Maigret OSINT Scan (Windows)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'The username to search for'
        required: true

jobs:
  osint_scan:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Extract Maigret Zip
      shell: powershell
      run: |
        $zipFile = Get-ChildItem -Filter "maigret*.zip" | Select-Object -First 1
        if ($null -eq $zipFile) {
            Write-Error "No zip file matching maigret*.zip found in the repository root!"
            exit 1
        }
        Write-Output "Extracting $($zipFile.Name)..."
        Expand-Archive -Path $zipFile.FullName -DestinationPath .\maigret_source -Force

    - name: Build and Install
      shell: powershell
      run: |
        python -m pip install --upgrade pip
        $srcFolder = Get-ChildItem -Path .\maigret_source | Where-Object { $_.PSIsContainer } | Select-Object -First 1
        cd $srcFolder.FullName
        pip install -e .

    - name: Run Maigret Scan
      shell: powershell
      env:
        PYTHONUTF8: 1 # Forces Python to output everything using UTF-8 encoding
      run: |
        # Force the Windows console instance to support UTF-8 characters
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        
        # Execute Maigret
        maigret ${{ github.event.inputs.username }} -a
