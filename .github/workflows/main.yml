name: Run Maigret OSINT Scan (Insanely Fast)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'The username to search for'
        required: true

jobs:
  osint_scan:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Cache a specific local directory we control
    - name: Cache Packages
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ./custom_packages
        key: ${{ runner.os }}-maigret-v2

    # Force pip to install directly into our cached directory if it's not already there
    - name: Install Maigret
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: pip install maigret --target=./custom_packages

    # Tell Python to look inside our custom directory, then run Maigret
    - name: Run Maigret Scan
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/custom_packages
        export PATH=$PATH:$(pwd)/custom_packages/bin
        python -m maigret ${{ github.event.inputs.username }} -a
