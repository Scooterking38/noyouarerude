name: Run Maigret OSINT Scan (Insanely Fast)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'The username to search for'
        required: true

jobs:
  osint_scan:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Manually cache the folder where pip installs everything
    - name: Cache Packages
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ~/.local/lib/python3.10/site-packages
        key: ${{ runner.os }}-maigret-v1

    # Only run pip install if the cache missed
    - name: Install Maigret
      if: steps.cache-pip.outputs.cache-hit != 'true'
      run: pip install maigret

    - name: Run Maigret Scan
      run: maigret ${{ github.event.inputs.username }} -a
